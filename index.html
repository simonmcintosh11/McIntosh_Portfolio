<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simon McIntosh</title>
  <meta name="description" content="Resume, research, and publications of Simon McIntosh.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#about" class="brand" id="brand"></a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#resume">Resume</a>
        <a href="#contact">Contact</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section id="about" class="hero">
      <div class="hero-photo" id="photo"></div>
      <div class="hero-text">
        <h1 id="name"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div id="about-text"></div>
        <ul class="chips" id="interests"></ul>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
    </section>

    <section id="news-section" class="section">
      <h2>News</h2>
      <ul class="news" id="news"></ul>
    </section>

    <section id="research" class="section">
      <h2>Research</h2>
      <div class="cards" id="research-list"></div>
    </section>

    <section id="publications" class="section">
      <div class="section-head">
        <h2>Publications</h2>
        <div class="filters" id="pub-filters" role="tablist"></div>
      </div>
      <div id="pub-list"></div>
    </section>

    <section id="resume" class="section">
      <div class="section-head">
        <h2>Resume</h2>
        <div id="cv-download"></div>
      </div>
      <div class="resume-grid">
        <div>
          <div id="experience-block">
            <h3>Experience</h3>
            <div class="timeline" id="experience"></div>
          </div>
          <div id="education-block">
            <h3>Education</h3>
            <div class="timeline" id="education"></div>
          </div>
        </div>
        <aside>
          <div id="awards-block">
            <h3>Awards &amp; Honours</h3>
            <ul class="plain" id="awards"></ul>
          </div>
          <div id="talks-block">
            <h3>Talks</h3>
            <ul class="plain" id="talks"></ul>
          </div>
          <div id="skills-block">
            <h3>Skills</h3>
            <div id="skills"></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="contact" class="section contact">
      <h2>Contact</h2>
      <p id="contact-text"></p>
      <ul class="link-row" id="contact-links"></ul>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
